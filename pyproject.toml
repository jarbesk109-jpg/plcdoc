[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plcdoc"
version = "0.0.1"
description = "Documentation and version diff for PLC projects from PLCopen XML exports."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "defusedxml>=0.7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
plcdoc = "plcdoc.cli:main"

[tool.setuptools]
packages = ["plcdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
